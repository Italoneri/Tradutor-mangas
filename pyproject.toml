[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangatl"
version = "0.1.0"
description = "Tradutor em lote de mahuas/mangas EN->PT com leitor web offline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    # Headless: o pipeline nunca abre janela, e a variante normal arrasta GTK e
    # dezenas de MB de X11 que num contêiner sao peso morto.
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "pydantic>=2.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
free = ["argostranslate>=1.9"]
# O detector treinado. Instale o torch pelo indice que casa com a sua maquina
# antes deste extra; o wheel CUDA tem ~2.5GB e nao serve sem GPU NVIDIA recente.
rtdetr = ["torch>=2.4", "transformers>=4.49"]
dev = ["pytest>=8.3"]

[project.scripts]
mangatl = "mangatl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mangatl"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src/mangatl"]
# Sem cache: o DrvFs do /mnt/c rejeita as operacoes de permissao que ele faz.
addopts = "-q -p no:cacheprovider"
