# Ajuste os thresholds de [detect] olhando as caixas desenhadas por --debug-boxes.

[paths]
library = "library"
output = "output"

[translation]
engine = "claude"
model = "claude-sonnet-5"
source_lang = "en"
target_lang = "pt"
chunk_pages = 12          # paginas por request a API
max_image_side = 1568     # px do lado maior enviado; acima disso nao melhora o OCR do modelo
timeout_seconds = 600.0
max_retries = 3
effort = "medium"

# Estimativa de custo para o log. Atualize se a tabela de precos mudar (USD por 1M tokens).
[pricing.claude-sonnet-5]
input = 2.0
output = 10.0
cache_read = 0.20

[pricing.claude-opus-5]
input = 5.0
output = 25.0
cache_read = 0.50

[ocr]
lang = "eng"
psm = 6                   # "bloco uniforme de texto" - o recorte ja isolou um balao
upscale = 3               # Tesseract quer ~30px de altura de caixa alta
padding = 4
min_confidence = 40.0     # abaixo disso e ruido de arte, nao fala; ver o porque de 40 no README
min_letters = 2           # simbolo solto nao e fala

[detect]
backend = "rtdetr"               # "heuristic" (visao classica) | "rtdetr" (modelo treinado)

# Os thresholds abaixo sao so do backend "heuristic".
min_area_ratio = 0.002
max_area_ratio = 0.35            # webtoon tem caixa de narracao ocupando a largura toda
min_aspect = 0.15
max_aspect = 8.0
min_fill_ratio = 0.55           # balao e convexo; mancha de arte nao
min_interior_brightness = 200.0 # brilho do papel, ja descontado o texto
min_ink_ratio = 0.02            # abaixo disso o balao esta vazio
max_ink_ratio = 0.40            # acima disso e arte escura, nao texto
merge_iou = 0.30

# Este vale para os dois backends: a fala cortada pela emenda entre paginas so
# aparece inteira quando o detector ve as duas metades juntas.
seam_band = 0.40                # fracao de cada pagina na faixa de emenda

# Calibrar o "rtdetr" e outra coisa: so estes dois limiares, nada de forma nem de brilho.
[detect.rtdetr]
model_id = "ogkalu/comic-text-and-bubble-detector"
confidence = 0.35         # abaixo disso o modelo chuta
artwork_confidence = 0.60 # texto sobre arte: falso positivo aqui desenha caixa em cima do desenho
device = "auto"           # "auto" | "cpu" | "cuda"
max_strip_height = 1600   # acima disso a pagina vai ao modelo em faixas
strip_overlap = 120       # sobreposicao entre faixas, para o balao da costura caber inteiro

[reading_order]
rtl = false               # true para manga japones
band_overlap = 0.40

# Captura de rolagem (webtoon) costurada numa imagem alta e fatiada antes do OCR.
# O corte procura a linha com menos tinta perto da altura alvo, para nao partir balao.
[slicing]
max_height = 1568         # igual a max_image_side: a fatia chega a API sem reducao
min_height = 400
tall_ratio = 3.0          # altura/largura acima disso e captura de rolagem
seam_window = 0.25        # busca a costura em +-25% da altura alvo
format = "jpeg"           # "png" preserva sem perda, mas pesa ~5x no celular
quality = 92

# O que uma conta de membro pode gastar. O dono ajusta conta a conta; isto e o
# padrao de quem nao foi ajustado. O dono nao tem teto, e o testador tem o seu.
[members]
disk_bytes = 2147483648   # 2GB: ~40 capitulos longos
pages_per_day = 600       # ~4 capitulos de 155 fatias
active_jobs = 3           # na fila ou rodando ao mesmo tempo
